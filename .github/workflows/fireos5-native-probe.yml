name: Fire OS 5 native ARMv7 compile probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'android/app/src/main/cpp/**'
      - 'android/app/build.gradle.kts'
      - '.github/workflows/fireos5-native-probe.yml'

permissions:
  contents: read

jobs:
  armv7-native:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned SDL and WebP sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nuvio-src"
          for url in \
            https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz \
            https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.2/SDL2_image-2.8.2.tar.gz \
            https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.22.0/SDL2_ttf-2.22.0.tar.gz \
            https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.4.0.tar.gz; do
            curl -fsSL --retry 3 "$url" | tar xz -C "$RUNNER_TEMP/nuvio-src"
          done
      - name: Configure ARMv7 (API 22) native libraries
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:?Android SDK missing}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"
          "$SDK/cmake/3.22.1/bin/cmake" \
            -S android/app/src/main/cpp \
            -B "$RUNNER_TEMP/fireos5-armv7" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$SDK/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-22 \
            -DANDROID_STL=c++_static \
            -DNUVIO_RAIZ="$GITHUB_WORKSPACE" \
            -DNUVIO_SDL_SRC="$RUNNER_TEMP/nuvio-src" \
            -DNUVIO_FIRE_OS5=ON
      - name: Build C libraries for Fire OS 5
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --build "$RUNNER_TEMP/fireos5-armv7" --target main -j 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Package experimental APK to test full Android integration
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          bash android/gradlew -p android --no-daemon --console=plain \
            -Pnuvio.fireOs5=true -Pnuvio.sdlSrc="$RUNNER_TEMP/nuvio-src" \
            :app:assembleDebug
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'package:|sdkVersion:|native-code:'
      - name: Explain scope
        if: always()
        run: |
          echo "CI-only minimal APK packaging test. No app assets, external native libcurl, personal config, release signing, P2P motor or publication; NOT suitable for installation/testing on Fire Stick." >> "$GITHUB_STEP_SUMMARY"
