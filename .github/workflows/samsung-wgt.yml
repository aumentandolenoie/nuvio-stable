name: Samsung Tizen WGT (validation and build)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tools/tizen*'
      - 'tools/build-ass-wasm.sh'
      - 'tools/env.sh'
      - 'deploy/app/**'
      - '.github/workflows/samsung-wgt.yml'

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      EMSDK_DIR: ${{ github.workspace }}/emsdk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate packaging scripts and source configuration
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/tizen.sh tools/tizen-wgt.sh tools/env.sh tools/build-ass-wasm.sh
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          app=json.load(open('deploy/app/appinfo.json'))
          root=ET.parse('tools/tizen-config.xml').getroot()
          assert app['version']==root.attrib['version'], (app['version'],root.attrib['version'])
          print('Version match:', app['version'])
          PY
      - name: Configure public Nuvio cloud endpoints (same as LG)
        shell: bash
        run: |
          set -euo pipefail
          # NuvioMedia's published client key, not a personal account credential.
          PUBLIC_KEY="$(curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/NuvioMedia/self-host/main/.env.example \
            | sed -n 's/^NUVIO_CLOUD_PUBLISHABLE_KEY=//p' | head -1)"
          [ -n "$PUBLIC_KEY" ] || { echo "::error::Public Nuvio cloud key unavailable"; exit 1; }
          umask 077
          printf '%s\n' \
            'NUVIO_SUPABASE_URL=https://api.nuvio.tv' \
            'TV_LOGIN_WEB_BASE_URL=https://nuvio.tv/tv-login' \
            'SIMKL_APP_NAME=nuvio' > local.properties
          printf 'NUVIO_SUPABASE_ANON_KEY=%s\n' "$PUBLIC_KEY" >> local.properties
          bash tools/env.sh --require-core > /dev/null
      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config cmake ninja-build meson python3-venv zip unzip xz-utils ffmpeg
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$EMSDK_DIR"
          "$EMSDK_DIR/emsdk" install latest
          "$EMSDK_DIR/emsdk" activate latest
      - name: Build subtitle dependencies
        shell: bash
        run: |
          set -euo pipefail
          source "$EMSDK_DIR/emsdk_env.sh" >/dev/null
          bash tools/build-ass-wasm.sh
      - name: Build WebAssembly and package unsigned Tizen WGT
        shell: bash
        run: |
          set -euo pipefail
          bash tools/tizen.sh
          version=$(python3 -c "import json; print(json.load(open('deploy/app/appinfo.json'))['version'])")
          NUVIO_WGT_NOME="NuvioStable-${version}-tizen" bash tools/tizen-wgt.sh
          test -s "NuvioStable-${version}-tizen.wgt"
          unzip -t "NuvioStable-${version}-tizen.wgt"
          for file in index.html index.js index.wasm decodificador.js config.xml icon.png; do
            unzip -Z1 "NuvioStable-${version}-tizen.wgt" | grep -Fxq "$file"
          done
          sha256sum "NuvioStable-${version}-tizen.wgt" > SHA256SUMS-samsung
      - name: Assemble and validate TizenBrew module (not published)
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('deploy/app/appinfo.json'))['version'])")
          python3 tools/tizenbrew-package.py "NuvioStable-${version}-tizen.wgt" build/tizenbrew-module
          cd build/tizenbrew-module
          node -e "const p=require('./package.json'); if(p.packageType!=='app'||p.appPath!=='app/index.html'||p.version!==process.argv[1]) process.exit(1)" "$version"
          npm pack --ignore-scripts --pack-destination ../..
          cd ../..
          tar -tzf aumentandolenoie-nuvio-stable-tizenbrew-*.tgz | grep -Fxq package/app/index.wasm
          tar -tzf aumentandolenoie-nuvio-stable-tizenbrew-*.tgz | grep -Fxq package/app/index.html
      - name: Upload TizenBrew module candidate
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-stable-tizenbrew-module-test
          path: build/aumentandolenoie-nuvio-stable-tizenbrew-*.tgz
          if-no-files-found: error
          retention-days: 14
      - name: Upload validated Samsung package
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-stable-samsung-wgt
          path: |
            NuvioStable-*-tizen.wgt
            SHA256SUMS-samsung
          if-no-files-found: error
          retention-days: 14
      - name: Clean local configuration
        if: always()
        shell: bash
        run: rm -f local.properties
