name: Fire OS 5 API 22 Gradle compatibility probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/fireos5-gradle-probe.yml'

permissions:
  contents: read

jobs:
  api22:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK prerequisites
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Resolve API22 dependencies and merged manifest
        shell: bash
        run: |
          set -euo pipefail
          bash android/gradlew -p android --no-daemon --console=plain -Pnuvio.fireOs5=true :app:dependencies --configuration debugRuntimeClasspath
          bash android/gradlew -p android --no-daemon --console=plain -Pnuvio.fireOs5=true :app:processDebugMainManifest
      - name: Scope
        if: always()
        run: |
          echo 'Android 5.1 dependency/manifest probe only: no compiled APK and no publication.' >> "$GITHUB_STEP_SUMMARY"
